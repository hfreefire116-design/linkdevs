<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สร้างโปรไฟล์ · LinkDevs</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,sans-serif;background:#0f172a;color:#f8fafc;padding:24px}.wrap{max-width:760px;margin:auto}.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px;margin-bottom:16px}h1{margin:0 0 8px}p{color:#94a3b8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field.full{grid-column:1/-1}label{font-size:12px;font-weight:700;color:#cbd5e1}input,textarea{font:inherit;color:#f8fafc;background:#0f172a;border:1px solid #475569;border-radius:9px;padding:11px}textarea{min-height:80px;resize:vertical}button{border:0;border-radius:9px;padding:12px 16px;font-weight:800;cursor:pointer;background:#3b82f6;color:white}button:disabled{opacity:.5}.hint{font-size:12px;color:#94a3b8}.ok{color:#34d399}.err{color:#f87171}.preview{background:#f8fafc;color:#111827;border-radius:16px;padding:24px;text-align:center;min-height:240px}.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#dbeafe;margin:auto;display:block}.link{display:block;text-decoration:none;color:#111827;background:white;border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin:9px auto;max-width:420px;font-weight:700}@media(max-width:600px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body><main class="wrap"><div class="card"><h1>สร้างโปรไฟล์ LinkDevs</h1><p>โปรไฟล์แบบ Linktree แสดงลิงก์ทั้งหมดพร้อมกัน ไม่มีเวลาหรือการล็อกปุ่ม</p><div class="grid"><div class="field"><label>@ชื่อผู้ใช้</label><input id="username" placeholder="yourname" maxlength="30" autocomplete="off"><span class="hint">ใช้ a-z, 0-9, _ และ - เท่านั้น</span></div><div class="field"><label>ชื่อที่แสดง</label><input id="name" placeholder="ชื่อของคุณ" maxlength="60"></div><div class="field full"><label>คำแนะนำตัว</label><textarea id="bio" placeholder="บอกเล่าเกี่ยวกับคุณ"></textarea></div><div class="field full"><label>รูปโปรไฟล์ URL (ไม่บังคับ)</label><input id="avatar" type="url" placeholder="https://..."></div><div class="field full"><label>ลิงก์ (หนึ่งบรรทัดต่อหนึ่งลิงก์: ชื่อ | URL)</label><textarea id="links" placeholder="เว็บไซต์ของฉัน | https://example.com\nInstagram | https://instagram.com/..."></textarea></div></div><button id="save" onclick="saveProfile()">สร้างโปรไฟล์</button><span id="msg" class="hint" style="margin-left:12px"></span></div><div class="card"><h2 style="margin-top:0">ตัวอย่างแบบเดียวกับหน้าจริง</h2><div id="preview" class="preview"></div></div></main><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><script>
const FB_URL='https://project-1996400454241260071-default-rtdb.asia-southeast1.firebasedatabase.app/';firebase.initializeApp({databaseURL:FB_URL});const db=firebase.database();
const $=id=>document.getElementById(id), safe=s=>String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function read(){let u=$('username').value.trim().toLowerCase().replace(/^@/,'');let links=$('links').value.split('\n').map(x=>x.split('|')).filter(x=>x.length>1&&/^https?:\/\//i.test(x[1].trim())).map(x=>({title:x[0].trim()||x[1].trim(),url:x[1].trim()}));return {username:u,name:$('name').value.trim()||u,bio:$('bio').value.trim(),avatar:$('avatar').value.trim(),links,mode:'profile',createdAt:firebase.database.ServerValue.TIMESTAMP}}
function render(){let d=read();$('preview').innerHTML=(d.avatar?`<img class="avatar" src="${safe(d.avatar)}" onerror="this.style.display='none'">`:'')+`<h2>${safe(d.name)}</h2><p>${safe(d.bio)}</p>`+d.links.map(l=>`<a class="link" href="${safe(l.url)}" target="_blank" rel="noopener">${safe(l.title)}</a>`).join('')}
['username','name','bio','avatar','links'].forEach(id=>$(id).addEventListener('input',render));render();
async function saveProfile(){let d=read(),m=$('msg'),b=$('save');if(!/^[a-z0-9_-]{3,30}$/.test(d.username))return m.className='err',m.textContent='ชื่อผู้ใช้ต้องมี 3-30 ตัวอักษร และใช้ a-z 0-9 _ - เท่านั้น';if(!d.links.length)return m.className='err',m.textContent='เพิ่มลิงก์อย่างน้อย 1 รายการ';b.disabled=true;m.textContent='กำลังตรวจสอบ...';try{let ref=db.ref('profiles/'+d.username),result;await ref.transaction(current=>{if(current!==null)return;result=d;return d});if(!result)return m.className='err',m.textContent='ชื่อนี้ถูกใช้งานแล้ว';let url=location.origin+'/profile.html?u='+encodeURIComponent(d.username);m.className='ok';m.innerHTML='สร้างสำเร็จ: <a target="_blank" href="'+url+'">เปิดโปรไฟล์</a>'}catch(e){m.className='err';m.textContent='เกิดข้อผิดพลาด: '+e.message}finally{b.disabled=false}}
</script></body></html>
