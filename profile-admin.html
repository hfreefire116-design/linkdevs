<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkDevs Profile Builder</title><link rel="icon" href="/favicon.ico"><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font-family:Inter,system-ui,sans-serif;padding:24px 16px}.wrap{max-width:620px;margin:auto}.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px;margin:14px 0}.field{display:grid;gap:6px;margin:14px 0}label{font-size:12px;color:#94a3b8;font-weight:700}input,textarea,select{width:100%;padding:12px;border:1px solid #475569;border-radius:9px;background:#0f172a;color:#fff;font:inherit}textarea{min-height:80px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.link{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.btn{border:0;border-radius:9px;padding:12px 16px;background:#3b82f6;color:#fff;font-weight:800;cursor:pointer}.ghost{background:#334155}.hint{font-size:12px;color:#94a3b8}#out{word-break:break-all;color:#86efac}@media(max-width:480px){.row{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><h1>สร้างโปรไฟล์ LinkDevs</h1><p class="hint">โปรไฟล์จะแสดงลิงก์ทั้งหมดทันที ไม่มีตัวจับเวลาและไม่มีการล็อกปุ่ม</p><form id="form" class="card"><div class="field"><label>ชื่อผู้ใช้ (ไม่ซ้ำกัน)</label><input id="username" required pattern="[a-zA-Z0-9_.-]{3,30}" placeholder="yourname"><small class="hint">ใช้ได้เฉพาะ a-z, 0-9, จุด ขีดล่าง และขีดกลาง</small></div><div class="field"><label>ชื่อที่แสดง</label><input id="displayName" required placeholder="ชื่อของคุณ"></div><div class="field"><label>Bio</label><textarea id="bio" placeholder="แนะนำตัวสั้น ๆ"></textarea></div><div class="field"><label>รูปโปรไฟล์ URL (ถ้ามี)</label><input id="avatar" type="url" placeholder="https://..."></div><div class="row"><div class="field"><label>สีพื้นหลัง</label><input id="backgroundColor" type="color" value="#111827"></div><div class="field"><label>ภาพพื้นหลัง URL</label><input id="backgroundImage" type="url" placeholder="https://..."></div></div><div class="field"><label>ความเข้ม overlay</label><input id="overlayOpacity" type="range" min="0" max="90" value="35"></div><div class="field"><label>ปุ่มลิงก์</label><div id="links"></div><button type="button" class="btn ghost" onclick="addLink()">+ เพิ่มปุ่ม</button></div><button class="btn" type="submit">เผยแพร่โปรไฟล์</button></form><div id="out"></div></main><script>firebase.initializeApp({databaseURL:'https://project-1996400454241260071-default-rtdb.asia-southeast1.firebasedatabase.app/'});const db=firebase.database();let n=0;function addLink(v={}){const d=document.createElement('div');d.className='link';d.innerHTML=`<input required placeholder="ชื่อปุ่ม" value="${v.title||''}"><input required type="url" placeholder="https://..." value="${v.url||''}">`;document.getElementById('links').appendChild(d);n++}addLink();form.onsubmit=async e=>{e.preventDefault();const u=username.value.trim().toLowerCase();if(!/^[a-z0-9_.-]{3,30}$/.test(u))return alert('ชื่อผู้ใช้ไม่ถูกต้อง');const ref=db.ref('profiles/'+u);const exists=await ref.once('value');if(exists.exists())return alert('ชื่อนี้ถูกใช้แล้ว กรุณาเลือกชื่ออื่น');const rows=[...document.querySelectorAll('.link')].map(x=>({title:x.children[0].value.trim(),url:x.children[1].value.trim(),icon:'link'})).filter(x=>x.title&&x.url);await ref.set({username:u,displayName:displayName.value.trim(),bio:bio.value.trim(),avatar:avatar.value.trim(),backgroundColor:backgroundColor.value,backgroundImage:backgroundImage.value.trim(),overlayOpacity:Number(overlayOpacity.value),links:rows,createdAt:firebase.database.ServerValue.TIMESTAMP});out.innerHTML=`โปรไฟล์พร้อมใช้งาน: <a href="/@${encodeURIComponent(u)}" target="_blank">/@${u}</a>`};</script></body></html>
