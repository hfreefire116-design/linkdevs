"currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>';$('badge').style.color=accent;$('status').textContent=d.pageType==='profile'?'PROFILE':a.length?`STEP ${Math.min(current+1,a.length)} OF ${a.length}`:'NO CONDITIONS';$('buttons').innerHTML=list.map((t)=>{let i=d.tasks.indexOf(t),open=t.locked===false,active=busy&&i===d.tasks.indexOf(a[current]);return `<div class="linkbtn ${active?'busy':''}" style="--accent:${accent};border-color:${active?accent:open?'#e5e7eb':accent}" onclick="activate(${i})"><span class="ico">${icons[t.icon]||'↗'}</span><span style="min-width:0;flex:1"><strong>${esc(t.name||'Open link')}</strong><small>${open?'OPEN LINK':active?'VERIFYING...':'TAP TO COMPLETE'}</small></span><span class="num">${i+1}</span></div>`}).join('')||'<div style="text-align:center;color:#64748b;padding:20px">No buttons configured</div>'}function activate(i){let t=d.tasks[i];if(!t||busy)return;if(t.locked===false){open(t.url);return}let a=locked(),pos=a.indexOf(t);if(d.ui.layout==='single'&&pos!==current)return;open(t.url);busy=true;render();let ms=Number(t.timer||0)*1000,start=Date.now();clearInterval(timer);timer=setInterval(()=>{if(Date.now()-start>=ms){clearInterval(timer);busy=false;current++;if(current>=a.length&&d.target){location.href=d.target;return}render()}},250)}function open(u){if(!u)return;try{let tg=window.Telegram&&window.Telegram.WebApp;if(tg&&tg.openLink)tg.openLink(u);else window.open(u,'_blank','noopener,noreferrer')}catch(e){location.href=u}}function load(){let p=new URLSearchParams(location.search),id=p.get('id')||location.pathname.replace(/^\//,'').split('/')[0],tg=window.Telegram&&window.Telegram.WebApp;id=id&&id!=='unlock.html'?id:tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param;if(!id){$('status').textContent='INVALID LINK';return}db.ref('locked_contents/'+id).once('value').then(s=>{if(!s.exists()){$('status').textContent='INVALID LINK';return}d=normal(s.val());
