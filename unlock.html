        if (iconBox) iconBox.style.cssText = 'align-items:center;background:#fef2f2;border-radius:14px;color:#ef4444;display:flex;height:48px;justify-content:center;margin-bottom:12px;transition:0.3s;width:48px;';
        const icon = document.getElementById('status-icon');
        if (icon) icon.innerHTML = ic(iconKey || 'warn');
        const tc = document.getElementById('task-container');
        if (tc) tc.classList.add('disabled-tasks');
    }

    // ── Task rendering ───────────────────────────────────────────────────
    function renderAllTasks() {
        if (adBlockDetected) return;
        const container = document.getElementById('task-container');
        const status    = document.getElementById('status-text');
        const badge     = document.getElementById('status-badge');

        container.style.display = 'flex';
        if (!container || !data) return;

        if (!data.tasks || data.tasks.length === 0 || currentIdx >= data.tasks.length) {
            return finishAllTasks();
        }

        if (taskState === 'idle') {
            status.innerText = `STEP ${currentIdx + 1} OF ${data.tasks.length}`;
            badge.style.color = '#007bff';
        }

        document.getElementById('status-icon').innerHTML = ic('shield');
        document.getElementById('status-icon-box').style.cssText = 'align-items:center;background:rgb(232,240,254);border-radius:14px;color:#007bff;display:flex;height:48px;justify-content:center;margin-bottom:12px;transition:0.3s;width:48px;';
        document.getElementById('main-title').innerText = 'Security Verification';

        const task = data.tasks[currentIdx];
        const iconKey = mapIcon(task.icon);
        let boxStyle, actionHtml, subText, clickAttr = '';

        if (taskState === 'verifying') {
            boxStyle   = 'border:2px solid #007bff;background:#e8f0fe;';
            subText    = '<span style="color:#007bff;font-weight:700;">VERIFYING... PLEASE WAIT</span>';
            actionHtml = '<div style="width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;"><div style="width:14px;height:14px;border:2px solid #007bff;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;"></div></div>';
        } else if (taskState === 'validating') {
            boxStyle   = 'border:2px solid #10b981;background:#f0fdf4;';
            subText    = '<span style="color:#10b981;font-weight:700;">SUCCESS!</span>';
            actionHtml = `<span style="color:#10b981;display:flex;">${ic('check', 20)}</span>`;
        } else {
            boxStyle   = 'border:2px dashed #e5e7eb;background:#ffffff;cursor:pointer;transition:transform 0.2s;';
            subText    = '<span style="color:#007bff;font-weight:700;text-transform:uppercase;">TAP TO COMPLETE</span>';
            actionHtml = ``;
            clickAttr  = `onclick="startVerification('${task.url}',${task.timer || 10})" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'"`;
        }

        container.innerHTML = `
            <div ${clickAttr} style="padding:14px 16px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;text-align:left;${boxStyle}">
                <div style="display:flex;align-items:center;gap:12px;">
                    <div style="color:${taskState === 'validating' ? '#10b981' : '#007bff'};display:flex;">${ic(iconKey)}</div>
                    <div>
                        <div style="font-weight:800;color:#111827;font-size:14px;margin:0 0 2px 0;">${task.name}</div>
                        <div style="font-size:11px;margin:0;">${subText}</div>
                    </div>
                </div>
                ${actionHtml}
            </div>`;
    }

    // ── Telegram Mini App detection ──────────────────────────────────────
    function isTelegramMiniApp() {
        try {
            const tg = window.Telegram && window.Telegram.WebApp;
            return !!(tg && tg.initData && tg.initData.length > 0);
        } catch(e) { return false; }
    }

    // ── Verification flow ────────────────────────────────────────────────
    function startVerification(url, time) {
        if (taskState !== 'idle') return;

        const inTelegram = isTelegramMiniApp();

        if (inTelegram) {
            // Telegram Mini App: use built-in openLink (works inside Mini App)
            try {
                window.Telegram.WebApp.openLink(url);
            } catch(e) {
                try { window.Telegram.WebApp.openTelegramLink(url); }
                catch(e2) { window.open(url, '_blank', 'noopener,noreferrer'); }
            }
        } else {
            try {
                const w = Math.min(800, window.screen.width * 0.9);
                const h = Math.min(600, window.screen.height * 0.9);
                const left = (window.screen.width - w) / 2;
                const top  = (window.screen.height - h) / 2;
                window.open(url, '_blank', `width=${w},height=${h},top=${top},left=${left},resizable=yes,scrollbars=yes`);
            } catch(e) { window.open(url, '_blank', 'noopener,noreferrer'); }
        }

        taskState = 'verifying';
        renderAllTasks();

        const requiredTime = time * 1000;
        const startTime    = Date.now();
        const deadline     = startTime + requiredTime;
        clearInterval(checkTimerInterval);

        if (inTelegram) {
            // Telegram Mini App: visibility/focus APIs are unreliable inside Mini App.
            // Just wait for the required time, then validate — no early-return check.
            checkTimerInterval = setInterval(() => {
                if (taskState !== 'verifying') { clearInterval(checkTimerInterval); return; }
                if (Date.now() >= deadline) { clearInterval(checkTimerInterval); processValidation(); }
            }, 500);
        } else {
            let hasLeftPage = false;
            checkTimerInterval = setInterval(() => {
                if (taskState !== 'verifying') { clearInterval(checkTimerInterval); return; }
                const now = Date.now();
                if (document.visibilityState === 'hidden' || !document.hasFocus()) hasLeftPage = true;
                if (now >= deadline) { clearInterval(checkTimerInterval); processValidation(); return; }
                if (now - startTime > 2000 && hasLeftPage && document.visibilityState === 'visible' && document.hasFocus()) {
                    failVerification('You returned to this page too early.');
                }
            }, 500);
        }
    }

    function failVerification(reason) {
        clearInterval(checkTimerInterval);
        taskState = 'idle';
        renderAllTasks();
        showToast('❌ Verification Failed! ' + reason, true);
    }

    function processValidation() {
        taskState = 'validating';
        renderAllTasks();
        setTimeout(() => {
            currentIdx++;
            sessionStorage.setItem('lk_idx', currentIdx);
            taskState = 'idle';
            if (currentIdx >= data.tasks.length) finishAllTasks();
            else renderAllTasks();
        }, 1200);
    }

    // ── Finish ───────────────────────────────────────────────────────────
    function finishAllTasks() {
        if (adBlockDetected) return;
        clearInterval(checkTimerInterval);
        sessionStorage.removeItem('lk_data');
        sessionStorage.removeItem('lk_idx');

        const content = data.target || data.content;
        const mode    = data.mode || (content ? 'url' : 'text');

        // Save completion payload for the success page to read
        localStorage.setItem('lk_done_mode',    mode);
        localStorage.setItem('lk_done_content',  content || '');
        localStorage.setItem('lk_done_image',    data.image || '');
        localStorage.setItem('lk_done_video',    data.video || '');

        // Redirect to success page
        window.location.href = 'success.html';
    }

    // ── Article header (for public content with title/desc/author) ──────────
    function injectArticleHeader() {
        if (!data || !data.title) return;
        if (document.getElementById('article-header')) return;
        var card = document.getElementById('unlock-card');
        if (!card) return;

        var catConf = {
            gaming:        { label: 'Gaming',        color: '#7c3aed', bg: '#f5f3ff' },
            software:      { label: 'Software',      color: '#007bff', bg: '#e8f0fe' },
            tutorial:      { label: 'Tutorial',      color: '#059669', bg: '#f0fdf4' },
            entertainment: { label: 'Entertainment', color: '#d97706', bg: '#fffbeb' },
            other:         { label: 'Other',         color: '#6b7280', bg: '#f3f4f6' }
        };
        var cat  = data.category || 'other';
        var conf = catConf[cat] || catConf.other;

        card.style.maxWidth = '540px';

        var header = document.createElement('div');
        header.id = 'article-header';
        header.style.cssText = 'text-align:left;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #f3f4f6;flex-shrink:0;';
        header.innerHTML =
            '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap;">'
              + '<span style="background:' + conf.bg + ';color:' + conf.color + ';font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.4px;">' + conf.label + '</span>'
              + '<button id="share-btn" onclick="shareCurrentLink()" style="display:flex;align-items:center;gap:5px;background:none;border:1px solid #e5e7eb;border-radius:8px;padding:5px 12px;font-size:11px;font-weight:600;color:#6b7280;cursor:pointer;font-family:inherit;transition:all .15s;">'
                + ic('link', 12) + ' Share'
              + '</button>'
            + '</div>'
            + '<h1 style="font-size:16px;font-weight:800;color:#111827;margin:0 0 8px;line-height:1.35;letter-spacing:-.3px;">' + data.title + '</h1>'
            + (data.desc   ? '<p style="font-size:12px;color:#6b7280;margin:0 0 10px;line-height:1.6;">' + data.desc + '</p>' : '')
            + (data.author ? '<div style="font-size:11px;color:#9ca3af;font-weight:600;">by ' + data.author + '</div>' : '');

        var imageWrap = document.getElementById('unlock-image-wrap');
        card.insertBefore(header, imageWrap);

        // Increment view counter on Firebase
        try {
            var params  = new URLSearchParams(window.location.search);
            var shortId = params.get('id');
            if (shortId && fbDb) {
                fbDb.ref('locked_contents/' + shortId + '/views').transaction(function(v){ return (v||0)+1; });
            }
        } catch(e) {}
    }

    function shareCurrentLink() {
        var url   = window.location.href;
        var title = (data && data.title) || 'LinkDevs';
        var btn   = document.getElementById('share-btn');
        function markCopied() {
            showToast('✅ Link copied!', false);
            if (btn) { btn.innerHTML = ic('check', 12) + ' Copied!'; setTimeout(function(){ btn.innerHTML = ic('link', 12) + ' Share'; }, 2000); }
        }
        if (navigator.share) {
            navigator.share({ title: title, url: url }).catch(function(){});
        } else if (navigator.clipboard) {
            navigator.clipboard.writeText(url).then(markCopied).catch(function(){
                var el = document.createElement('textarea'); el.value = url;
                document.body.appendChild(el); el.select(); document.execCommand('copy'); el.remove();
                markCopied();
            });
        } else {
            var el = document.createElement('textarea'); el.value = url;
            document.body.appendChild(el); el.select(); document.execCommand('copy'); el.remove();
            markCopied();
        }
    }

    // ── Boot sequence ────────────────────────────────────────────────────
    function startApp() {
        if (adBlockDetected) return;
        injectArticleHeader();
        applyMedia();
        renderAllTasks();
    }

    function bootSequence() {
        if (adBlockDetected) return;
        document.getElementById('status-icon').innerHTML = ic('shield');
        document.getElementById('status-text').innerText = 'LOADING...';

        // 1. session restore (fastest — no async)
        if (restoreFromSession()) { startApp(); return; }

        // 2. short link ?id= (query string) OR pretty URL /gVwnBg (pathname)
        const params = new URLSearchParams(window.location.search);
        const pathId = window.location.pathname.replace(/^\//, '').split('/')[0];
        const hasShortId = params.get('id') || (pathId && pathId !== 'unlock.html' ? pathId : '');
        if (hasShortId) {
            tryLoadFromShortId(ok => { if (ok) startApp(); else showInvalidLink(); });
            return;
        }

        // 3. encrypted ?d= / ?data=
        if (tryDecryptFromUrl()) { startApp(); return; }

        // 4. Telegram Mini App start_param → Firebase
        tryLoadFromFirebase(ok => { if (ok) startApp(); else showInvalidLink(); });
    }

    window.onload = () => {
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
            // Signal Telegram that the Mini App UI is ready,
            // then give the SDK one tick to finish populating initDataUnsafe
            // before we try to read start_param
            tg.ready();
            setTimeout(bootSequence, 200);
        } else {
            bootSequence();
        }
    };
