<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LinkDevs</title><link rel="icon" href="/favicon.ico"><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif}body{background:#f8f9fa}.disabled{pointer-events:none;opacity:.55}.overlay{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px;background:#f8f9fa;background-size:cover;background-position:center;position:relative}.overlay:after{content:"";position:fixed;inset:0;background:rgba(15,23,42,.3);pointer-events:none}.card{position:relative;z-index:1;background:rgba(255,255,255,.96);border:1px solid rgba(243,244,246,.9);border-radius:24px;width:100%;max-width:420px;max-height:92vh;overflow:hidden;padding:22px 18px;box-shadow:0 20px 50px #0f172a33}.head{text-align:center;margin-bottom:18px}.icon{width:50px;height:50px;border-radius:14px;margin:0 auto 11px;display:grid;place-items:center;font-size:24px}.title{font-size:18px;font-weight:800;color:#111827;margin-bottom:9px}.badge{display:inline-flex;gap:6px;align-items:center;border-radius:20px;padding:5px 12px;border:1px solid #dbeafe;font-size:11px;font-weight:800}.dot{width:6px;height:6px;border-radius:50%;display:inline-block}.tasks{display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:55vh}.task{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:2px dashed #e5e7eb;border-radius:14px;background:#fff;color:#111827;cursor:pointer;transition:.2s}.task:hover{transform:scale(1.015)}.task.locked{border-color:var(--accent,#007bff);background:#fff}.task.open{border-style:solid}.task.busy{border-style:solid;background:#e8f0fe}.task.done{border-color:#10b981;background:#f0fdf4}.left{display:flex;align-items:center;gap:12px;min-width:0}.taskicon{width:30px;height:30px;border-radius:9px;background:#f1f5f9;display:grid;place-items:center;font-weight:800;color:var(--accent,#007bff);flex-shrink:0}.name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hint{font-size:11px;font-weight:800;color:var(--accent,#007bff);margin-top:3px;text-transform:uppercase}.number{width:25px;height:25px;border:1px solid #e5e7eb;border-radius:8px;display:grid;place-items:center;font-size:11px;color:#64748b;flex-shrink:0}.toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-80px);padding:12px 20px;border-radius:30px;background:#ef4444;color:white;font-weight:800;transition:.25s;z-index:5;text-align:center}.toast.show{transform:translate(-50%,0)}@media(max-height:600px){.card{max-height:96vh}.tasks{max-height:48vh}}
</style></head><body><div id="app" class="overlay"><div class="card"><div class="head"><div id="icon" class="icon">♢</div><div id="title" class="title">Security Verification</div><div id="badge" class="badge"><span id="dot" class="dot"></span><span id="status">LOADING...</span></div></div><div id="tasks" class="tasks"></div></div></div><div id="toast" class="toast"></div><script>
const FB='https://project-1996400454241260071-default-rtdb.asia-southeast1.firebasedatabase.app/';firebase.initializeApp({databaseURL:FB});const db=firebase.database();let data=null,index=0,busy=false,timer=null;const $=id=>document.getElementById(id);const icon=t=>({youtube:'▶',tiktok:'♪',instagram:'◎',facebook:'f',telegram:'✈',discord:'D',twitter:'𝕏',twitch:'◉',whatsapp:'W',link:'↗'}[t]||'↗');
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}
function normalize(d){d=d||{};d.tasks=Array.isArray(d.tasks)?d.tasks:[];d.ui=Object.assign({layout:'all',backgroundType:'color',backgroundColor:'#f8f9fa',backgroundImage:'',overlayOpacity:30,accentColor:'#007bff'},d.ui||{});d.pageType=d.pageType||'gate';return d}
function applyStyle(){let u=data.ui,o=(u.overlayOpacity/100).toFixed(2),a=$('app');a.style.setProperty('--accent',u.accentColor);if(u.backgroundType==='image'&&u.backgroundImage){a.style.backgroundImage=`linear-gradient(rgba(15,23,42,${o}),rgba(15,23,42,${o})),url("${u.backgroundImage.replace(/"/g,'\\"')}")`;a.style.backgroundColor=u.backgroundColor}else if(u.backgroundType==='gradient'){a.style.backgroundImage=`linear-gradient(135deg,${u.backgroundColor},#dbeafe)`}else{a.style.backgroundImage='none';a.style.backgroundColor=u.backgroundColor}document.querySelector('.card').style.setProperty('--accent',u.accentColor)}
function visibleTasks(){if(data.pageType==='profile'||data.ui.layout==='all')return data.tasks;let locked=data.tasks.filter(x=>x.locked!==false);return locked.length?[locked[index]]:data.tasks}
function render(){if(!data)return;applyStyle();let locked=data.tasks.filter(x=>x.locked!==false),shown=visibleTasks();$('title').textContent=data.pageType==='profile'?'LinkDevs Profile':'Security Verification';$('icon').textContent=data.pageType==='profile'?'🔗':'♢';$('icon').style.color=data.ui.accentColor;$('icon').style.background=data.ui.accentColor+'1a';$('badge').style.color=data.ui.accentColor;$('dot').style.background=data.ui.accentColor;$('status').textContent=data.pageType==='profile'?'PROFILE':locked.length?`STEP ${Math.min(index+1,locked.length)} OF ${locked.length}`:'NO CONDITIONS';$('tasks').innerHTML=shown.map((t,i)=>{let n=data.tasks.indexOf(t)+1,open=t.locked===false;return `<div class="task ${open?'open':'locked'}" onclick="activate(${n-1})"><div class="left"><div class="taskicon">${icon(t.icon)}</div><div><div class="name">${escapeHtml(t.name||'Open link')}</div><div class="hint">${open?'OPEN LINK':(busy&&data.tasks.indexOf(t)===index?'VERIFYING...':'TAP TO COMPLETE')}</div></div></div><div class="number">${n}</div></div>`}).join('')||'<div style="text-align:center;color:#64748b;padding:20px">No buttons configured</div>'}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function activate(i){let t=data.tasks[i];if(!t||busy)return;if(t.locked===false){open(t.url);return}let locked=data.tasks.filter(x=>x.locked!==false),pos=locked.indexOf(t);if(data.ui.layout==='single'&&pos!==index)return;open(t.url);busy=true;render();let sec=Number(t.timer||0),start=Date.now();clearInterval(timer);timer=setInterval(()=>{if(Date.now()-start>=sec*1000){clearInterval(timer);busy=false;index++;if(index>=locked.length){if(data.target){location.href=data.target}else{toast('All tasks completed');render()}}else render()}},250)}
function open(url){if(!url)return;try{let tg=window.Telegram&&window.Telegram.WebApp;if(tg&&tg.openLink)tg.openLink(url);else window.open(url,'_blank','noopener,noreferrer')}catch(e){location.href=url}}
function load(){let p=new URLSearchParams(location.search),id=p.get('id')||location.pathname.replace(/^\//,'').split('/')[0];let tg=window.Telegram&&window.Telegram.WebApp;let start=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param;id=id&&id!=='unlock.html'?id:start;if(!id){$('status').textContent='INVALID LINK';return}db.ref('locked_contents/'+id).once('value').then(s=>{if(!s.exists()){$('status').textContent='INVALID LINK';return}data=normalize(s.val());render()}).catch(()=>{$('status').textContent='LOAD ERROR'})}
if(window.Telegram&&Telegram.WebApp)Telegram.WebApp.ready();load();
</script></body></html>
