<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unlock · LinkDevs</title><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font:14px Inter,system-ui,sans-serif;background:#f8f9fa;color:#111827}#page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background-size:cover;background-position:center}.card{width:min(420px,100%);max-height:92vh;overflow:auto;background:#fffffff2;border-radius:24px;padding:24px 18px;box-shadow:0 18px 45px #0f172a22;text-align:center}.icon{font-size:38px}.title{font-size:19px;font-weight:900;margin:10px}.badge{display:inline-block;border-radius:999px;padding:6px 13px;background:#fff;border:1px solid #e5e7eb;font-weight:800;font-size:11px;margin-bottom:15px}.task{display:flex;align-items:center;justify-content:space-between;text-align:left;padding:14px;margin:9px 0;background:#fff;border:1px dashed #d1d5db;border-radius:14px;cursor:pointer}.task:hover{transform:translateY(-1px)}.task small{display:block;color:#007bff;font-weight:800;margin-top:3px}.media{width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-bottom:14px}.error{color:#b91c1c;background:#fee2e2;padding:18px;border-radius:12px;font-weight:800}</style></head><body><main id="page"><div class="card" id="card">กำลังโหลด...</div></main><script>const FB='https://project-1996400454241260071-default-rtdb.asia-southeast1.firebasedatabase.app/';firebase.initializeApp({databaseURL:FB});const db=firebase.database(),$=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));let data,idx=0;function fail(t){$('card').innerHTML='<div class="error">'+t+'</div>'}function apply(){let u=data.ui||{},a=u.accentColor||'#007bff',bg=u.backgroundType==='image'&&u.backgroundImage?`linear-gradient(#0f172a${Math.round((u.overlayOpacity||30)*2.55).toString(16).padStart(2,'0')},#0f172a${Math.round((u.overlayOpacity||30)*2.55).toString(16).padStart(2,'0')}),url('${u.backgroundImage.replaceAll("'",'')}')`:u.backgroundColor||'#f8f9fa';$('page').style.background=bg;let tasks=data.tasks||[];function draw(){if(idx>=tasks.length){$('card').innerHTML='<div class="icon">✅</div><div class="title">ปลดล็อกสำเร็จ</div>';setTimeout(()=>{if(data.mode==='text')$('card').insertAdjacentHTML('beforeend','<p>'+esc(data.target)+'</p>');else location.href=data.target},700);return}let shown=u.layout==='all'?tasks:tasks.slice(idx,idx+1);$('card').innerHTML=(data.image?`<img class="media" src="${esc(data.image)}">`:'')+`<div class="icon">🛡️</div><div class="title">${esc(data.title||'Security Verification')}</div><div class="badge" style="color:${a}">${u.layout==='all'?'TASKS READY':'STEP '+(idx+1)+' OF '+tasks.length}</div>`+shown.map((t,i)=>`<div class="task" data-i="${u.layout==='all'?tasks.indexOf(t):idx}"><span>${esc(t.name)}<small style="color:${a}">TAP TO COMPLETE</small></span><b>✓</b></div>`).join('');document.querySelectorAll('.task').forEach(x=>x.onclick=()=>{let n=+x.dataset.i,wait=+(tasks[n].timer||0);x.style.opacity='.6';setTimeout(()=>{if(u.layout==='all'){x.remove();if(!document.querySelector('.task')){idx=tasks.length;draw()}}else{idx++;draw()}},wait*1000)})}draw()}let id=new URLSearchParams(location.search).get('id')||location.pathname.split('/').filter(Boolean).pop();if(!id||id==='unlock.html')fail('ไม่พบลิงก์');else db.ref('locked_contents/'+id).once('value').then(s=>{if(!s.exists())return fail('ไม่พบข้อมูลนี้');data=s.val();apply()}).catch(()=>fail('โหลดข้อมูลไม่สำเร็จ'));</script></body></html>
