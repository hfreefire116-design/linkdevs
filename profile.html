<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>โปรไฟล์ · LinkDevs</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;font:15px Inter,system-ui,sans-serif;background:linear-gradient(135deg,#dbeafe,#f8fafc);color:#111827}.wrap{max-width:560px;margin:auto;text-align:center}.avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#bfdbfe;box-shadow:0 8px 25px #64748b44}h1{margin:14px 0 5px;font-size:25px}#bio{color:#64748b;white-space:pre-wrap;margin:0 0 22px}.link{display:block;padding:15px 18px;margin:12px 0;border-radius:14px;background:#fff;color:#111827;text-decoration:none;font-weight:750;box-shadow:0 8px 20px #64748b22;transition:.15s}.link:hover{transform:translateY(-2px);box-shadow:0 12px 25px #64748b33}.error{color:#b91c1c;background:#fee2e2;padding:16px;border-radius:12px}</style></head><body><main class="wrap" id="app">กำลังโหลด...</main><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><script>firebase.initializeApp({databaseURL:'https://project-1996400454241260071-default-rtdb.asia-southeast1.firebasedatabase.app/'});const esc=s=>String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));let u=new URLSearchParams(location.search).get('u')||location.pathname.split('/').filter(Boolean).pop();firebase.database().ref('profiles/'+String(u).toLowerCase().replace(/^@/,'')).once('value').then(s=>{let d=s.val();if(!d)return app.innerHTML='<div class="error">ไม่พบโปรไฟล์นี้</div>';app.innerHTML=(d.avatar?`<img class="avatar" src="${esc(d.avatar)}" onerror="this.style.display='none'">`:'')+`<h1>${esc(d.name||d.username)}</h1><div id="bio">${esc(d.bio)}</div>`+(d.links||[]).map(l=>`<a class="link" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title||l.url)}</a>`).join('')}).catch(()=>app.innerHTML='<div class="error">โหลดโปรไฟล์ไม่สำเร็จ</div>');</script></body></html>
