<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LinkDevs Profile</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root{--accent:#6366f1;--text:#111827;--muted:#6b7280;--card:#ffffff;--page:#f3f4f6}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,sans-serif;color:var(--text);background:var(--page);display:flex;justify-content:center;padding:28px 16px}main{width:min(100%,620px);text-align:center}.avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;background:#e5e7eb;border:4px solid #fff;box-shadow:0 10px 30px #0002}.name{font-size:25px;font-weight:800;margin:14px 0 5px}.bio{color:var(--muted);font-size:14px;line-height:1.6;margin:0 auto 22px;white-space:pre-wrap}.links{display:grid;gap:12px}.link{display:flex;align-items:center;justify-content:center;min-height:58px;padding:14px 20px;border-radius:16px;background:var(--card);color:var(--text);text-decoration:none;font-weight:700;box-shadow:0 8px 24px #1111;transition:.2s}.link:hover{transform:translateY(-2px);box-shadow:0 12px 30px #1112}.empty{color:var(--muted);padding:40px 10px}.brand{display:block;margin-top:28px;color:#9ca3af;font-size:11px;text-decoration:none;font-weight:700;letter-spacing:.4px}
  </style>
</head>
<body><main id="app"><div class="empty">Loading profile…</div></main>
<script>
const FB_URL='https://project-1996400454241260071-default-rtdb.asia-southeast1.firebasedatabase.app/';
if(!firebase.apps.length)firebase.initializeApp({databaseURL:FB_URL});
const db=firebase.database();
const username=(location.pathname.split('/').filter(Boolean)[0]||'').replace(/^@/,'').toLowerCase();
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(p){
 if(!p){document.getElementById('app').innerHTML='<div class="empty"><h2>Profile not found</h2><p>This username is available.</p></div>';return}
 const ui=p.ui||{}; const links=Array.isArray(p.links)?p.links:(Array.isArray(p.tasks)?p.tasks:[]);
 document.documentElement.style.setProperty('--accent',ui.accentColor||p.accentColor||'#6366f1');
 document.documentElement.style.setProperty('--page',ui.backgroundColor||'#f3f4f6');
 if(ui.backgroundImage)document.body.style.background=`linear-gradient(#0004,#0004),url("${ui.backgroundImage.replace(/"/g,'')}" ) center/cover fixed`;
 document.getElementById('app').innerHTML=`${p.avatar?`<img class="avatar" src="${esc(p.avatar)}" alt="">`:''}<h1 class="name">${esc(p.displayName||p.name||'@'+username)}</h1>${p.bio?`<p class="bio">${esc(p.bio)}</p>`:''}<div class="links">${links.map(l=>`<a class="link" href="${esc(l.url||l.u||'#')}" target="_blank" rel="noopener noreferrer">${esc(l.name||l.title||l.n||'Link')}</a>`).join('')}</div><a class="brand" href="/">LINKDEVS</a>`;
}
if(!username)render(null);else db.ref('profiles/'+username).once('value').then(s=>render(s.val())).catch(()=>render(null));
</script></body></html>
